<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Product preview card </title>
</head>
<body>
<main class="contaner">
  <article class="card">

    <div class="img-card">
      <picture>
        <source srcset="images/image-product-desktop.jpg" media="(min-width:600px)">
        <img src="images/image-product-mobile.jpg" alt="perfume img">
      </picture>
    </div>
    <div class="content">
      <p class="product-name">Perfume</p>
      <h1>Gabrielle Essence Eau De Parfum</h1>
      <p class="product-des">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        <div class="price">
          <h2>$149.99</h2>
          <p>$169.99</p>
        </div>
        <button><img src="images/icon-cart.svg" alt="icon cart">Add to Cart</button>
    </div>
  </article>
</main>
</body>
</html>
